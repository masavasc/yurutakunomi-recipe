<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ゆる宅飲み">
  <title>ゆる宅飲み レシピ検索</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1>ゆる宅飲みレシピ検索</h1>
    </header>

    <section class="filters" aria-label="検索条件">
      <div class="filter-block">
        <h2>大分類</h2>
        <div id="categoryChips" class="chips"></div>
      </div>

      <div class="filter-block">
        <h2>料理タイプ</h2>
        <div id="typeChips" class="chips"></div>
      </div>

      <div class="filter-block">
        <label for="ingredientInput" class="field-label">食材から検索</label>
        <div class="input-wrap">
          <input id="ingredientInput" type="search" inputmode="search"
                 autocomplete="off" placeholder="例：なす、チーズ、ホタテ">
          <button id="clearIngredient" class="clear-input" aria-label="食材検索を消去" hidden>×</button>
        </div>
      </div>
    </section>

    <section class="results-section">
      <div class="results-heading">
        <h2>検索結果</h2>
        <span id="resultCount" class="count"></span>
      </div>
      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input id="keywordInput" type="search" autocomplete="off" placeholder="料理名・キーワードで検索">
      </div>
      <div id="results" class="results" aria-live="polite"></div>
    </section>
  </main>

  <script src="recipes.js"></script>
  <script src="app.js"></script>
</body>
</html>
